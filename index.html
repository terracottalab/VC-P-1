<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #6b6a45;
      --bg-sand: #d9c9a8;
      --card: #f4ecd8;
      --card-soft: #efe4cc;
      --ink: #3a3824;
      --muted: #5c5840;
      --line: #cbb896;
      --olive: #5e6640;
      --olive-deep: #454b2e;
      --sand: #e8d9b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse 80% 60% at 12% 18%, rgba(232, 217, 184, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 88% 82%, rgba(94, 102, 64, 0.28), transparent 50%),
        linear-gradient(145deg, var(--bg-sand) 0%, #c4b78a 42%, var(--bg-deep) 100%);
      background-size: 140% 140%;
      animation: sandShift 18s ease-in-out infinite alternate;
    }

    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow:
        0 22px 48px rgba(58, 56, 36, 0.16),
        0 0 0 1px rgba(255, 250, 236, 0.4) inset;
      animation: riseIn 0.7s ease both;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 28px;
      color: var(--olive-deep);
      animation: fadeDown 0.7s ease 0.12s both;
    }

    ol {
      list-style: none;
      counter-reset: item;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li {
      counter-increment: item;
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
      padding: 14px 16px;
      background: var(--sand);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: default;
      opacity: 0;
      animation: slideUp 0.55s ease both;
      transition: transform 0.28s ease, background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    li:nth-child(1) { animation-delay: 0.22s; }
    li:nth-child(2) { animation-delay: 0.32s; }
    li:nth-child(3) { animation-delay: 0.42s; }
    li:nth-child(4) { animation-delay: 0.52s; }
    li:nth-child(5) { animation-delay: 0.62s; }

    li:hover {
      transform: translateX(6px);
      background: var(--card-soft);
      border-color: var(--line);
      box-shadow: 0 8px 18px rgba(69, 75, 46, 0.08);
    }

    li::before {
      content: counter(item);
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Manrope", system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f7f1df;
      background: var(--olive);
      border-radius: 999px;
      position: relative;
      top: 1px;
      transition: transform 0.28s ease, background 0.28s ease;
    }

    li:hover::before {
      transform: scale(1.08) rotate(-8deg);
      background: var(--olive-deep);
    }

    @keyframes sandShift {
      from { background-position: 0% 40%; }
      to { background-position: 100% 60%; }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      main,
      h1,
      li {
        animation: none;
        opacity: 1;
        transform: none;
      }

      body {
        background-size: 100% 100%;
      }

      li:hover,
      li:hover::before {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ol>
      <li>Пять идей постов из трёх пунктов</li>
      <li>Пять идей постов для экспертов</li>
      <li>Три идеи stories на сегодня</li>
      <li>Контент-план на неделю</li>
      <li>Мотивация дня</li>
    </ol>
  </main>
</body>
</html>
