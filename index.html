<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #6b6a45;
      --bg-sand: #d9c9a8;
      --card: #f4ecd8;
      --card-soft: #efe4cc;
      --ink: #3a3824;
      --muted: #5c5840;
      --line: #cbb896;
      --olive: #5e6640;
      --olive-deep: #454b2e;
      --sand: #e8d9b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      display: grid;
      grid-template-columns: auto minmax(0, 560px) auto;
      justify-content: center;
      align-items: center;
      column-gap: 16px;
      padding: 32px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 12% 18%, rgba(232, 217, 184, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 88% 82%, rgba(94, 102, 64, 0.28), transparent 50%),
        linear-gradient(145deg, var(--bg-sand) 0%, #c4b78a 42%, var(--bg-deep) 100%);
      background-size: 140% 140%;
      animation: sandShift 18s ease-in-out infinite alternate;
    }

    .fruit {
      width: 132px;
      height: 132px;
      pointer-events: none;
      filter: drop-shadow(0 14px 18px rgba(58, 56, 36, 0.22));
      animation: fruitFloat 5.5s ease-in-out infinite;
    }

    .fruit svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .fruit-avocado {
      animation-duration: 6.2s;
      animation-direction: reverse;
    }

    main {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow:
        0 22px 48px rgba(58, 56, 36, 0.16),
        0 0 0 1px rgba(255, 250, 236, 0.4) inset;
      animation: riseIn 0.7s ease both;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 28px;
      color: var(--olive-deep);
      overflow-wrap: break-word;
      animation: fadeDown 0.7s ease 0.12s both;
    }

    ol {
      list-style: none;
      counter-reset: item;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li {
      counter-increment: item;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: baseline;
      gap: 14px;
      min-width: 0;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.45;
      overflow-wrap: break-word;
      color: var(--muted);
      padding: 14px 16px;
      background: var(--sand);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: default;
      opacity: 0;
      animation: slideUp 0.55s ease both;
      transition: transform 0.28s ease, background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    li:nth-child(1) { animation-delay: 0.22s; }
    li:nth-child(2) { animation-delay: 0.32s; }
    li:nth-child(3) { animation-delay: 0.42s; }
    li:nth-child(4) { animation-delay: 0.52s; }
    li:nth-child(5) { animation-delay: 0.62s; }

    li:hover {
      transform: translateX(6px);
      background: var(--card-soft);
      border-color: var(--line);
      box-shadow: 0 8px 18px rgba(69, 75, 46, 0.08);
    }

    li::before {
      content: counter(item);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Manrope", system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f7f1df;
      background: var(--olive);
      border-radius: 999px;
      position: relative;
      top: 1px;
      transition: transform 0.28s ease, background 0.28s ease;
    }

    li:hover::before {
      transform: scale(1.08) rotate(-8deg);
      background: var(--olive-deep);
    }

    @keyframes sandShift {
      from { background-position: 0% 40%; }
      to { background-position: 100% 60%; }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fruitFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 860px) {
      body {
        column-gap: 10px;
      }

      .fruit {
        width: 72px;
        height: 72px;
      }
    }

    @media (max-width: 520px) {
      body {
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        column-gap: 6px;
        padding: 24px 8px;
      }

      .fruit {
        width: 44px;
        height: 44px;
      }

      main {
        padding: 28px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      main,
      h1,
      li,
      .fruit {
        animation: none;
        opacity: 1;
      }

      .fruit-orange,
      .fruit-avocado { transform: none; }

      body {
        background-size: 100% 100%;
      }

      li:hover,
      li:hover::before {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="fruit fruit-orange" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="108" rx="28" ry="6" fill="rgba(58,56,36,0.18)"/>
        <circle cx="60" cy="66" r="38" fill="#e08a2a"/>
        <circle cx="60" cy="66" r="38" fill="url(#orangeGlow)"/>
        <circle cx="60" cy="66" r="32" fill="#f2a13a" opacity="0.55"/>
        <path d="M60 32c8 10 11 22 8 34-8-6-16-8-24-6 4-12 8-22 16-28Z" fill="#ffd08a" opacity="0.45"/>
        <circle cx="48" cy="52" r="7" fill="#ffe3b0" opacity="0.55"/>
        <path d="M58 28c2-14 14-20 26-16-8 6-12 14-10 24-6-2-12-4-16-8Z" fill="#4e6a32"/>
        <path d="M62 30c6-10 16-12 22-8-10 3-14 10-14 16-4-2-6-4-8-8Z" fill="#6f8d42"/>
        <path d="M60 28c1 6 0 12-2 16" stroke="#3f5228" stroke-width="2.2" stroke-linecap="round"/>
        <defs>
          <radialGradient id="orangeGlow" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0%" stop-color="#ffc46a"/>
            <stop offset="70%" stop-color="#e08a2a"/>
            <stop offset="100%" stop-color="#c56a16"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <main>
      <h1>Генератор идей для постов</h1>
      <ol>
        <li>Пять идей постов из трёх пунктов</li>
        <li>Пять идей постов для экспертов</li>
        <li>Три идеи stories на сегодня</li>
        <li>Контент-план на неделю</li>
        <li>Мотивация дня</li>
      </ol>
    </main>

    <div class="fruit fruit-avocado" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="62" cy="108" rx="26" ry="6" fill="rgba(58,56,36,0.18)"/>
        <path d="M61 18c18 0 34 22 34 48s-16 40-34 40S26 92 26 66 43 18 61 18Z" fill="#3f5a28"/>
        <path d="M61 24c14 0 27 19 27 42s-13 34-27 34S34 89 34 66 47 24 61 24Z" fill="#6f8a3c"/>
        <path d="M61 32c10 0 20 15 20 34s-10 28-20 28S41 85 41 66 51 32 61 32Z" fill="#d7c56a"/>
        <ellipse cx="61" cy="66" rx="12" ry="13" fill="#6b4423"/>
        <ellipse cx="61" cy="66" rx="9" ry="10" fill="#8a5a2a"/>
        <ellipse cx="57" cy="61" rx="3.2" ry="3.6" fill="#f0d7a4" opacity="0.7"/>
        <path d="M48 44c8-8 18-10 28-6" stroke="#efe6b8" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      </svg>
    </div>
</body>
</html>
