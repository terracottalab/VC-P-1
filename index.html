<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #6b6a45;
      --bg-sand: #d9c9a8;
      --card: #f4ecd8;
      --card-soft: #efe4cc;
      --ink: #3a3824;
      --muted: #5c5840;
      --line: #cbb896;
      --olive: #5e6640;
      --olive-deep: #454b2e;
      --sand: #e8d9b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      display: grid;
      grid-template-columns: auto minmax(0, 600px) auto;
      justify-content: center;
      align-items: start;
      column-gap: 16px;
      padding: 48px 16px 64px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 12% 18%, rgba(232, 217, 184, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 88% 82%, rgba(94, 102, 64, 0.28), transparent 50%),
        linear-gradient(145deg, var(--bg-sand) 0%, #c4b78a 42%, var(--bg-deep) 100%);
      background-size: 140% 140%;
      animation: sandShift 18s ease-in-out infinite alternate;
    }

    .fruit {
      width: 132px;
      height: 132px;
      margin-top: 56px;
      pointer-events: none;
      filter: drop-shadow(0 14px 18px rgba(58, 56, 36, 0.22));
      animation: fruitFloat 5.5s ease-in-out infinite;
    }

    .fruit svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .fruit-avocado {
      animation-duration: 6.2s;
      animation-direction: reverse;
    }

    main {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow:
        0 22px 48px rgba(58, 56, 36, 0.16),
        0 0 0 1px rgba(255, 250, 236, 0.4) inset;
      animation: riseIn 0.7s ease both;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 18px;
      color: var(--olive-deep);
      overflow-wrap: break-word;
      animation: fadeDown 0.7s ease 0.12s both;
    }

    .occupation {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
      padding: 14px 16px 15px;
      background: var(--sand);
      border: 1px solid var(--line);
      border-radius: 12px;
      animation: fadeDown 0.7s ease 0.16s both;
      transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .occupation-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--olive-deep);
    }

    .occupation input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .occupation input::placeholder {
      color: #8a8468;
    }

    .occupation input:focus {
      outline: none;
      border-color: var(--olive);
      box-shadow: 0 0 0 3px rgba(94, 102, 64, 0.18);
    }

    .occupation-hint {
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--muted);
    }

    .occupation.is-invalid {
      border-color: #8a5340;
      box-shadow: 0 0 0 3px rgba(138, 83, 64, 0.12);
    }

    .occupation.is-invalid .occupation-hint {
      color: #8a5340;
    }

    .result-niche {
      margin: -6px 0 14px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .formats {
      list-style: none;
      counter-reset: item;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .formats > li {
      counter-increment: item;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: baseline;
      gap: 14px;
      min-width: 0;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.45;
      overflow-wrap: break-word;
      color: var(--muted);
      padding: 14px 16px;
      background: var(--sand);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0;
      animation: slideUp 0.55s ease both;
      transition: transform 0.28s ease, background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .choice {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .formats > li:nth-child(1) { animation-delay: 0.22s; }
    .formats > li:nth-child(2) { animation-delay: 0.32s; }
    .formats > li:nth-child(3) { animation-delay: 0.42s; }
    .formats > li:nth-child(4) { animation-delay: 0.52s; }
    .formats > li:nth-child(5) { animation-delay: 0.62s; }

    .formats > li:hover,
    .formats > li:focus-within {
      transform: translateX(6px);
      background: var(--card-soft);
      border-color: var(--line);
      box-shadow: 0 8px 18px rgba(69, 75, 46, 0.08);
    }

    .formats > li.is-active {
      background: var(--card-soft);
      border-color: var(--olive);
      color: var(--olive-deep);
      box-shadow: 0 8px 18px rgba(69, 75, 46, 0.1);
    }

    .formats > li::before {
      content: counter(item);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Manrope", system-ui, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f7f1df;
      background: var(--olive);
      border-radius: 999px;
      position: relative;
      top: 1px;
      transition: transform 0.28s ease, background 0.28s ease;
    }

    .formats > li:hover::before,
    .formats > li:focus-within::before,
    .formats > li.is-active::before {
      transform: scale(1.08) rotate(-8deg);
      background: var(--olive-deep);
    }

    .generate {
      margin-top: 20px;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--olive);
      color: #f7f1df;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
    }

    .generate:hover {
      background: var(--olive-deep);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(69, 75, 46, 0.16);
    }

    .generate:focus-visible,
    .choice:focus-visible,
    .occupation input:focus-visible {
      outline: 2px solid var(--olive-deep);
      outline-offset: 3px;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      animation: fadeDown 0.45s ease both;
    }

    .result.is-open {
      display: block;
    }

    .result h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--olive-deep);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .output {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      counter-reset: none;
    }

    .output-item {
      display: block;
      padding: 14px 16px;
      background: var(--sand);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      animation: none;
      opacity: 1;
      cursor: default;
    }

    .output-item:hover,
    .output-item:hover::before {
      transform: none;
      background: var(--sand);
      border-color: var(--line);
      box-shadow: none;
    }

    .output-item strong {
      display: block;
      margin-bottom: 6px;
      color: var(--olive-deep);
    }

    .output-item p {
      margin: 0;
    }

    .output-item ul {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
      font-weight: 500;
    }

    .quote {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.2rem;
      line-height: 1.4;
      color: var(--olive-deep);
      margin-bottom: 10px;
    }

    .action {
      color: var(--muted);
    }

    @keyframes sandShift {
      from { background-position: 0% 40%; }
      to { background-position: 100% 60%; }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fruitFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 860px) {
      body {
        column-gap: 10px;
      }

      .fruit {
        width: 72px;
        height: 72px;
        margin-top: 36px;
      }
    }

    @media (max-width: 520px) {
      body {
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        column-gap: 6px;
        padding: 24px 8px;
      }

      .fruit {
        width: 44px;
        height: 44px;
        margin-top: 22px;
      }

      main {
        padding: 28px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      main,
      h1,
      .occupation,
      .formats > li,
      .fruit,
      .result {
        animation: none;
        opacity: 1;
      }

      .fruit-orange,
      .fruit-avocado { transform: none; }

      body {
        background-size: 100% 100%;
      }

      .formats > li:hover,
      .formats > li:hover::before,
      .generate:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="fruit fruit-orange" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="108" rx="28" ry="6" fill="rgba(58,56,36,0.18)"/>
        <circle cx="60" cy="66" r="38" fill="#e08a2a"/>
        <circle cx="60" cy="66" r="38" fill="url(#orangeGlow)"/>
        <circle cx="60" cy="66" r="32" fill="#f2a13a" opacity="0.55"/>
        <path d="M60 32c8 10 11 22 8 34-8-6-16-8-24-6 4-12 8-22 16-28Z" fill="#ffd08a" opacity="0.45"/>
        <circle cx="48" cy="52" r="7" fill="#ffe3b0" opacity="0.55"/>
        <path d="M58 28c2-14 14-20 26-16-8 6-12 14-10 24-6-2-12-4-16-8Z" fill="#4e6a32"/>
        <path d="M62 30c6-10 16-12 22-8-10 3-14 10-14 16-4-2-6-4-8-8Z" fill="#6f8d42"/>
        <path d="M60 28c1 6 0 12-2 16" stroke="#3f5228" stroke-width="2.2" stroke-linecap="round"/>
        <defs>
          <radialGradient id="orangeGlow" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0%" stop-color="#ffc46a"/>
            <stop offset="70%" stop-color="#e08a2a"/>
            <stop offset="100%" stop-color="#c56a16"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <main>
      <h1>Генератор идей для постов</h1>
      <label class="occupation" id="occupation-box">
        <span class="occupation-label">Чем вы занимаетесь?</span>
        <input
          type="text"
          id="occupation"
          name="occupation"
          maxlength="80"
          autocomplete="off"
          placeholder="Например: финансы, психология, дизайн интерьеров"
        >
        <span class="occupation-hint" id="occupation-hint">Напишите род деятельности — появятся темы из этой практики, а не название профессии.</span>
      </label>
      <ol class="formats" id="formats">
        <li class="is-active">
          <button class="choice" type="button" data-kind="posts3" aria-pressed="true">Пять идей постов из трёх пунктов</button>
        </li>
        <li>
          <button class="choice" type="button" data-kind="experts" aria-pressed="false">Пять идей постов для экспертов</button>
        </li>
        <li>
          <button class="choice" type="button" data-kind="stories" aria-pressed="false">Три идеи stories на сегодня</button>
        </li>
        <li>
          <button class="choice" type="button" data-kind="week" aria-pressed="false">Контент-план на неделю</button>
        </li>
        <li>
          <button class="choice" type="button" data-kind="motivation" aria-pressed="false">Мотивация дня</button>
        </li>
      </ol>
      <button class="generate" type="button" id="generate">Собрать 5 постов</button>
      <section class="result" id="result" aria-live="polite"></section>
    </main>

    <div class="fruit fruit-avocado" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="62" cy="108" rx="26" ry="6" fill="rgba(58,56,36,0.18)"/>
        <path d="M61 18c18 0 34 22 34 48s-16 40-34 40S26 92 26 66 43 18 61 18Z" fill="#3f5a28"/>
        <path d="M61 24c14 0 27 19 27 42s-13 34-27 34S34 89 34 66 47 24 61 24Z" fill="#6f8a3c"/>
        <path d="M61 32c10 0 20 15 20 34s-10 28-20 28S41 85 41 66 51 32 61 32Z" fill="#d7c56a"/>
        <ellipse cx="61" cy="66" rx="12" ry="13" fill="#6b4423"/>
        <ellipse cx="61" cy="66" rx="9" ry="10" fill="#8a5a2a"/>
        <ellipse cx="57" cy="61" rx="3.2" ry="3.6" fill="#f0d7a4" opacity="0.7"/>
        <path d="M48 44c8-8 18-10 28-6" stroke="#efe6b8" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      </svg>
    </div>
  <script>
    function p(title, a, b, c) {
      return { title, points: [a, b, c] };
    }

    function e(title, angle) {
      return { title, angle };
    }

    function s(hook, two, three) {
      return { hook, frames: [two, three] };
    }

    function m(text, action) {
      return { text, action };
    }

    function week(items) {
      const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
      return days.map((day, i) => ({ day, item: items[i] }));
    }

    const fields = [
      {
        keys: ["диетолог", "диетологи", "диетология", "диет", "нутриц", "питани", "рацион", "похуд", "зож", "пп", "калори", "меню на", "пищев"],
        horizon: "питание, продукты и привычки за столом",
        posts3: [
          p("Почему срывы на выходных возвращаются, даже если будни были «идеальными»", "Что происходит с голодом и запретами к пятнице вечеру", "Как выглядит корзина, когда сил выбирать продукты уже нет", "Какой перекус заранее снимает вечерний набег на сладкое"),
          p("Как читать этикетку, если маркетинг кричит громче состава", "На какие 3 строки смотреть в первую очередь", "Какие слова на упаковке почти ничего не значат", "Простая замена в списке покупок на эту неделю"),
          p("Из чего собрать тарелку, чтобы энергии хватило до вечера", "Роль белка, клетчатки и привычного гарнира без войны", "Почему «салат вместо обеда» часто заканчивается ночным холодильником", "Шаблон одной спокойной тарелки на работу"),
          p("Почему правило «после 18 нельзя» ломает аппетит сильнее позднего ужина", "Как ранний запрет разгоняет голод и тревогу", "Чем поздний приём пищи отличается от бесконтрольного перекуса", "Как договориться со временем ужина без чувства вины"),
          p("Тяга к сладкому — не всегда про силу воли", "Какие сигналы тела путают с «слабохарактерностью»", "Что проверить в рационе, прежде чем снова себя ругать", "Одна мягкая замена, которую реально удержать 7 дней"),
          p("Вода, кофе и ложный голод: как отличить одно от другого", "Признаки, что хочется не еду, а паузу или жидкость", "Как кофе маскирует пропущенный приём пищи", "Мини-ритуал перед тем, как открыть холодильник"),
          p("Семейный ужин без отдельных «правильных» тарелок", "Почему отдельные меню стыдят быстрее, чем помогают", "Как собрать общее блюдо и точечно усилить свою порцию", "Фраза за столом, которая снижает напряжение"),
          p("Список покупок, в который не улетают случайные акции", "Как планировать 2–3 базовых завтрака на неделю", "Что класть в корзину, если времени готовить почти нет", "Где оставить место для удовольствия, чтобы не было срыва"),
          p("Почему подсчёт калорий выматывает — и чем его заменить", "Какую задачу цифры решают, а какую маскируют", "Наблюдение за сытостью вместо ежедневной арифметики", "Эксперимент на 5 дней без приложения, но с заметками"),
          p("Человек «ест правильно» и всё равно нет энергии", "Какие пропуски приёмов пищи выглядят как дисциплина", "Где теряется железо, белок или просто объём еды", "Один вопрос, который стоит задать до новых запретов")
        ],
        experts: [
          e("Разбор ошибки: убрать группу продуктов вместо того, чтобы собрать рацион", "Покажите, чем жёсткое вычёркивание отличается от замены и к чему это приводит через 2–3 недели."),
          e("Почему детокс-неделя редко становится привычкой", "Разберите, что обещает очищение, что происходит с аппетитом после и какую стабильную рутину ставите вместо этого."),
          e("Как я читаю пищевой дневник без оценки «хорошо / плохо»", "3 колонки наблюдения: время, сытость, контекст. Какой вывод из этого важнее калорий."),
          e("Белок на завтрак: кому это опора, а кому лишний стресс", "Коротко: когда усиление завтрака помогает, а когда человек ещё не готов менять утро."),
          e("Что я уточняю, прежде чем говорить про вес", "Сон, лекарства, стресс, доступ к еде. Почему цифра на весах — не первая точка входа."),
          e("Миф «все калории одинаковы» в реальной тарелке", "Где энергия, сытость и поведение за столом расходятся — на простых примерах из корзины.")
        ],
        stories: [
          s("Слайд 1: «Сегодня в магазине 10 секунд смотрела на состав, а не на зелёную галочку».", "Слайд 2: Какие 2 строки на этикетке решили покупку.", "Слайд 3: Вопрос: а вы на что смотрите первым?"),
          s("Слайд 1: «Будничный обед без геройства: что реально было в тарелке».", "Слайд 2: Белок + гарнир + цвет. Без взвешивания.", "Слайд 3: Предложите подписчикам прислать свой обед без стыда."),
          s("Слайд 1: Опрос: «Где сейчас сложнее — завтрак, перекус или вечер?»", "Слайд 2: Короткий комментарий к каждому варианту.", "Слайд 3: Один приём, который помогает именно вечером."),
          s("Слайд 1: «До / после: как я переписала запрет в договор с собой».", "Слайд 2: Было: «сладкое нельзя». Стало: «сладкое после обеда, не на голодный желудок».", "Слайд 3: Почему так держится лучше."),
          s("Слайд 1: «Стакан воды перед тем, как открыть холодильник. Честный отчёт за день».", "Слайд 2: Когда это был голод, а когда просто усталость.", "Слайд 3: Попросите отметить, что чаще путают они.")
        ],

        e("Как решаете, когда данных мало", "Три вопроса, стоп-сигнал, что делаете с серым ответом."),
        e("Быстрый путь и системный: когда какой", "Где люди их путают."),
        e("Что проверяете, прежде чем назвать цифру", "Чек-лист оценки задачи — глубина, не прайс.")
      ],
      stories: [
        s("Слайд 1: «Мысль, которую раньше стеснялась сказать вслух».", "Слайд 2: Откуда она из рабочего дня.", "Слайд 3: Какой маленький шаг из этого следует."),
        s("Слайд 1: Опрос: «Где застреваете — понять задачу, сделать или показать?»", "Слайд 2: Короткий комментарий.", "Слайд 3: Один приём."),
        s("Слайд 1: «Сырая заметка до того, как стать текстом».", "Слайд 2: Три строки из телефона.", "Слайд 3: Как собирается заголовок."),
        s("Слайд 1: «До / после одной фразы».", "Слайд 2: В чём была дыра.", "Слайд 3: Почему новая цепляет."),
        s("Слайд 1: «Вопрос, который задаю в первые 10 минут».", "Слайд 2: Что обычно слышу.", "Слайд 3: Как это меняет план.")
      ],
      week: [
        week([
          "Пост-наблюдение: какая ошибка всплывала чаще всего.",
          "Stories: один рабочий приём без теории.",
          "Экспертный разбор популярного совета.",
          "Опрос: где аудитория буксует.",
          "Личный кейс: что вышло и что нет.",
          "Пять коротких тезисов или закулисье.",
          "Вопрос аудитории, чтобы собрать темы на следующую неделю."
        ])
      ],
      motivation: [
        m("Не нужно идеальное настроение, чтобы закончить один честный абзац.", "Напишите заголовок и три пункта — остальное можно завтра."),
        m("Рабочий день уже материал. Не ждите гениальную тему.", "Достаньте из переписки одну повторяющуюся боль."),
        m("Страх «это и так все знают» часто значит: вы знаете это живее.", "Добавьте одну деталь, которую мог написать только вы."),
        m("Короткий текст сегодня полезнее идеального в заметках.", "Вычеркните треть и оставьте только живое.")
      ]
    };

    function normalize(text) {
      return String(text).toLowerCase().replace(/ё/g, "е");
    }

    function matchField(input) {
      const compact = normalize(input).replace(/[^a-zа-я0-9]+/g, " ").replace(/\s+/g, " ").trim();
      const tokens = compact.split(" ").filter(Boolean);
      let found = fallback;
      let score = 0;

      fields.forEach((field) => {
        field.keys.forEach((key) => {
          const k = normalize(key).trim();
          if (!k) return;
          let s = 0;
          if (k.length <= 2) {
            if (tokens.includes(k)) s = 12;
          } else if (compact === k) {
            s = 100;
          } else if (compact.includes(k)) {
            s = 40 + k.length;
          } else if (k.length >= 5 && compact.length >= 4 && k.includes(compact)) {
            s = 28;
          } else if (tokens.some((token) => token.length >= 4 && (token.startsWith(k) || k.startsWith(token)))) {
            s = 22 + Math.min(k.length, 12);
          }
          if (s > score) {
            score = s;
            found = field;
          }
        });
      });

      return found;
    }

    const labels = {
      posts3: "Собрать 5 постов",
      experts: "Собрать 5 экспертных постов",
      stories: "Собрать 3 stories",
      week: "Собрать план на неделю",
      motivation: "Получить мотивацию дня"
    };

    const headings = {
      posts3: "Пять идей постов из трёх пунктов",
      experts: "Пять идей постов для экспертов",
      stories: "Три идеи stories на сегодня",
      week: "Контент-план на неделю",
      motivation: "Мотивация дня"
    };

    const generateBtn = document.getElementById("generate");
    const result = document.getElementById("result");
    const choices = [...document.querySelectorAll(".choice")];
    const occupationBox = document.getElementById("occupation-box");
    const occupationInput = document.getElementById("occupation");
    const occupationHint = document.getElementById("occupation-hint");
    const defaultHint = occupationHint.textContent;
    const occupationKey = "vc-occupation";

    occupationInput.value = localStorage.getItem(occupationKey) || "";

    function getNiche() {
      return occupationInput.value.trim().replace(/\s+/g, " ");
    }

    function setOccupationError(on) {
      occupationBox.classList.toggle("is-invalid", on);
      occupationHint.textContent = on
        ? "Сначала напишите род деятельности — без этого идеи не к чему привязать."
        : defaultHint;
    }

    function pick(list, count) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, count);
    }

    function selectedKind() {
      const active = document.querySelector(".choice[aria-pressed='true']");
      return active ? active.dataset.kind : "posts3";
    }

    function selectChoice(button) {
      choices.forEach((item) => {
        const on = item === button;
        item.setAttribute("aria-pressed", String(on));
        item.parentElement.classList.toggle("is-active", on);
      });
      generateBtn.textContent = labels[button.dataset.kind];
    }

    function renderPosts3(field) {
      return pick(field.posts3, 5).map((post, index) => `
        <article class="output-item">
          <strong>${index + 1}. ${post.title}</strong>
          <ul>${post.points.map((point) => `<li>${point}</li>`).join("")}</ul>
        </article>
      `).join("");
    }

    function renderExperts(field) {
      return pick(field.experts, 5).map((post, index) => `
        <article class="output-item">
          <strong>${index + 1}. ${post.title}</strong>
          <p class="action">${post.angle}</p>
        </article>
      `).join("");
    }

    function renderStories(field) {
      const todayRaw = new Date().toLocaleDateString("ru-RU", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
      const today = todayRaw.charAt(0).toUpperCase() + todayRaw.slice(1);
      return pick(field.stories, 3).map((story, index) => `
        <article class="output-item">
          <strong>${index + 1}. Stories · ${today}</strong>
          <ul>
            <li>${story.hook}</li>
            ${story.frames.map((frame) => `<li>${frame}</li>`).join("")}
          </ul>
        </article>
      `).join("");
    }

    function renderWeek(field) {
      const plan = pick(field.week, 1)[0];
      return plan.map((row) => `
        <article class="output-item">
          <strong>${row.day}</strong>
          <p class="action">${row.item}</p>
        </article>
      `).join("");
    }

    function renderMotivation(field) {
      const item = pick(field.motivation, 1)[0];
      return `
        <article class="output-item">
          <p class="quote">${item.text}</p>
          <p class="action">${item.action}</p>
        </article>
      `;
    }

    const renderers = {
      posts3: renderPosts3,
      experts: renderExperts,
      stories: renderStories,
      week: renderWeek,
      motivation: renderMotivation
    };

    occupationInput.addEventListener("input", () => {
      localStorage.setItem(occupationKey, occupationInput.value);
      if (occupationBox.classList.contains("is-invalid") && getNiche()) {
        setOccupationError(false);
      }
    });

    occupationInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        generate();
      }
    });

    function generate() {
      const niche = getNiche();
      if (!niche) {
        setOccupationError(true);
        occupationInput.focus();
        return;
      }

      setOccupationError(false);
      const field = matchField(niche);
      const kind = selectedKind();
      result.classList.add("is-open");
      result.innerHTML = `
        <h2>${headings[kind]}</h2>
        <p class="result-niche">Темы: ${field.horizon}</p>
        <div class="output">${renderers[kind](field)}</div>
      `;
      result.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
        block: "nearest"
      });
    }

    choices.forEach((button) => {
      button.addEventListener("click", () => selectChoice(button));
    });

    document.querySelectorAll(".formats > li").forEach((li) => {
      li.addEventListener("click", (event) => {
        if (event.target.closest(".choice")) return;
        selectChoice(li.querySelector(".choice"));
      });
    });

    generateBtn.addEventListener("click", generate);
  </script>
</body>
</html>
